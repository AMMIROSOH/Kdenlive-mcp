name: Bug report
description: Report a reproducible problem in a supported feature
title: '[Bug]: '
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not report vulnerabilities here. Use the private Security advisory flow.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment and doctor output
      description: Remove private paths and tokens.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction
      description: Include minimal steps, expected behavior, and actual behavior.
    validations:
      required: true
