name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check for release marker
        id: release_marker
        uses: actions/github-script@v7
        with:
          result-encoding: string
          script: |
            const marker = '[release]';
            const commitMessage = context.payload.head_commit?.message ?? '';

            if (commitMessage.includes(marker)) {
              return 'true';
            }

            const {data: pullRequests} = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner: context.repo.owner,
              repo: context.repo.repo,
              commit_sha: context.sha,
            });

            const markedPullRequest = pullRequests.some((pullRequest) =>
              pullRequest.merged_at &&
              (pullRequest.title.includes(marker) || (pullRequest.body ?? '').includes(marker)),
            );

            const mergedReleasePleasePullRequest = pullRequests.some((pullRequest) =>
              pullRequest.merged_at &&
              pullRequest.head.ref.startsWith('release-please--'),
            );

            return markedPullRequest || mergedReleasePleasePullRequest ? 'true' : 'false';

      - name: Run Release Please
        if: steps.release_marker.outputs.result == 'true'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
